<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Sessions</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header class="app-header full-width">
        <div class="logo"><img id="faviconImg" class="app-logo" alt="" src="../../icons/edge-sessions-128.png" /> Edge Sessions</div>
        <div class="header-actions">
            <div class="live-stats" id="liveStats">Loading...</div>
            <button id="openOptions" class="btn header-settings" type="button" aria-label="Open Edge Sessions settings" title="Settings">⚙ Settings</button>
        </div>
    </header>

    <div class="history-left">
        <section class="surface-card save-box">
            <input id="sessionName" class="form-control" type="text" placeholder="Name this session... e.g. Project Apollo" />
            <button id="saveBtn" class="btn small" title="Save Entire Session">💾</button>
            <p class="hint">Saves all windows, tabs, and tab group names + colors</p>
        </section>

        <div id="progress" class="progress hidden">
            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
            <span id="progressText"></span>
        </div>

        <div class="filter-toggle" id="filterToggle">
            <button type="button" data-filter="all" class="active">All</button>
            <button type="button" data-filter="user">User</button>
            <button type="button" data-filter="auto">Auto</button>
        </div>

        <div class="search-box">
            <input id="listSearch" class="form-control" type="search" placeholder="Search sessions, tabs, URLs, or domains…" aria-label="Search sessions, tab titles, URLs, or domains" />
        </div>

        <section class="list-header">
            <h3 class="header-title">Saved Sessions</h3>
            <span id="countLabel"></span>
        </section>

        <div class="session-list-wrapper">
            <div id="sessionList" class="session-list"></div>
        </div>
    </div>

    <div class="detail-right">
        <section class="detail-panel hidden" id="detailPanel">
            <div class="surface-card detail-meta">
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                    <h2 class="detail-name" id="detailName"></h2>
                    <span class="detail-source-badge user" id="detailSourceBadge">user</span>
                </div>
                <p class="detail-sub" id="detailSub"></p>
            </div>
            <div class="detail-actions">
                <button id="detailRestoreBtn" class="btn small">🗗 Restore All</button>
                <button id="detailDeleteBtn" class="btn small">❌ Delete</button>
            </div>
            <div class="search-box">
                <input id="detailSearch" class="form-control" type="search" placeholder="Search tabs by title, URL, or domain…" aria-label="Search tabs in session" />
            </div>
            <h3 class="header-title">Tabs (window › group › tab)</h3>
            <div class="detail-tree-wrapper">
                <div class="detail-tree" id="detailTree"></div>
            </div>
        </section>
        <div class="empty-state" id="detailEmpty">
            <p>Select a session to view its tabs and details.</p>
        </div>
    </div>

    <template id="sessionTemplate">
        <article class="surface-card session-card">
            <div class="card-top">
                <div>
                    <div class="session-name"></div>
                    <div class="session-meta"></div>
                </div>
                <div class="card-actions">
                    <button class="icon-btn restore" aria-label="Restore This Session" title="Restore This Session">🗗</button>
                    <button class="icon-btn rename" aria-label="Rename This Session" title="Rename This Session">🗒</button>
                    <button class="icon-btn delete" aria-label="Delete This Session" title="Delete This Session">❌</button>
                </div>
            </div>
            <div class="groups-preview"></div>
        </article>
    </template>

    <template id="tabRowTemplate">
        <div class="tab-row" role="listitem">
            <img class="tab-favicon" alt="" />
            <div style="flex:1; min-width:0;">
                <div class="tab-title"></div>
                <div class="tab-domain"></div>
            </div>
            <div class="tab-actions">
                <button class="icon-btn open-tab" aria-label="Open in new tab">↗</button>
                <button class="icon-btn open-window" aria-label="Open in new window">⊞</button>
            </div>
        </div>
    </template>

    <script type="module" src="popup.js"></script>
</body>

</html>
