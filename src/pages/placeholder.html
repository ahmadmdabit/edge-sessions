<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💤 Lazy Tab - Edge Sessions</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="placeholder.css">
</head>

<body>
    <main class="surface-card placeholder-card">
        <div class="badge">Edge Sessions • LAZY TAB</div>

        <!-- NEW: OG Image Banner -->
        <div id="ogImageWrap" class="og-image-wrap hidden">
            <img id="ogImage" class="og-image" alt="" />
        </div>

        <div class="favicon-wrap">
            <img id="faviconImg" class="placeholder-favicon" alt="" />
            <div id="faviconFallback" class="favicon-fallback">🌐</div>
        </div>

        <h1 id="title">Loading...</h1>
        <p id="domain" class="domain"></p>
        <p id="url" class="url"></p>

        <!-- NEW: Description from saved meta -->
        <p id="description" class="description hidden"></p>
        <p id="groupInfo" class="group-info"></p>

        <button id="loadBtn" class="btn primary placeholder-primary">Load This Page →</button>
        <button id="openInNewTabBtn" class="btn secondary placeholder-secondary">Open in New Tab ↗</button>

        <p class="hint">
            Restored as placeholder to prevent OOM.<br>
            Click the tab or button to load the real page.
        </p>

        <div class="footer">
            <span id="savedAt"></span>
            <button id="copyUrlBtn" class="btn link">Copy URL</button>
        </div>
    </main>
    <script src="placeholder.js"></script>
</body>

</html>
